<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frag</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111118'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0b10;
        overflow: hidden;
      }

      :root {
        color: #f4f6fb;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .overlay {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        pointer-events: auto;
        background: rgba(10, 11, 16, 0.55);
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay:focus {
        outline: none;
      }

      #click-to-play,
      #pause {
        cursor: pointer;
      }

      .panel {
        position: relative;
        box-sizing: border-box;
        width: min(440px, 100%);
        padding: 36px 32px 28px;
        background: #14151c;
        border: 1px solid rgba(0, 229, 255, 0.75);
        box-shadow: 0 0 32px rgba(0, 229, 255, 0.16);
      }

      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #00e5ff, #ff2e9f);
      }

      #content-warning .panel {
        border-color: rgba(245, 166, 35, 0.9);
        box-shadow: 0 0 32px rgba(245, 166, 35, 0.16);
      }

      #content-warning .panel::before {
        background: #f5a623;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #f5a623;
        font-size: clamp(12px, 1.7vh, 18px);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
      }

      .copy {
        margin: 0;
        color: #d5d8e2;
        font-size: clamp(16px, 2.35vh, 28px);
        line-height: 1.45;
      }

      button {
        margin-top: 24px;
        padding: 12px 22px;
        border: 0;
        background: #f5a623;
        color: #111118;
        font: inherit;
        font-size: clamp(16px, 2.1vh, 24px);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid #00e5ff;
        outline-offset: 3px;
      }

      #fps-readout {
        position: fixed;
        top: 10px;
        left: 12px;
        z-index: 3;
        margin: 0;
        padding: 4px 8px;
        background: rgba(10, 11, 16, 0.8);
        color: #c8ff3d;
        font-family: ui-monospace, monospace;
        font-size: clamp(12px, 1.7vh, 18px);
        letter-spacing: 0.04em;
      }

      #fps-readout[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app-shell" data-phase="warning">
      <section
        id="content-warning"
        class="overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="content-warning-title"
      >
        <div class="panel">
          <p class="eyebrow">Content warning</p>
          <h1 id="content-warning-title">Frag</h1>
          <p class="copy">
            This prototype contains blood and gibs, fictional violence, and flashing lights
            (muzzle flash, neon, bloom).
          </p>
          <button id="content-warning-continue" type="button" autofocus>Continue</button>
        </div>
      </section>

      <section
        id="click-to-play"
        class="overlay"
        hidden
        tabindex="0"
        role="dialog"
        aria-modal="true"
        aria-labelledby="click-to-play-title"
      >
        <div class="panel">
          <h1 id="click-to-play-title">Frag</h1>
          <p class="copy">This is a prototype. Click or press Enter to play.</p>
        </div>
      </section>

      <section
        id="pause"
        class="overlay"
        hidden
        tabindex="0"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pause-title"
      >
        <div class="panel">
          <h1 id="pause-title">Paused</h1>
          <p class="copy">Click to resume.</p>
        </div>
      </section>
    </div>
    <p id="fps-readout" hidden>— fps</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
