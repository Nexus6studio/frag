name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy staging
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: staging

      - name: Report staging URL
        run: echo "static_web_app_url=${STATIC_WEB_APP_URL}"
        env:
          STATIC_WEB_APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
