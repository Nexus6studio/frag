name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build or verify repo hygiene
        run: |
          if [ -f package.json ]; then
            npm ci && npm run build
          else
            test -f LICENSE && test -f ASSETS.md
          fi
