name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to publish to the production slot
        type: choice
        options:
          - coming-soon
          - game
        default: coming-soon

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deploy prod only runs when dispatched from main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        if: inputs.target == 'game'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        if: inputs.target == 'game'
        run: npm ci

      - name: Build
        if: inputs.target == 'game'
        run: npm run build

      - name: Deploy production
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ${{ inputs.target == 'game' && 'dist' || 'coming-soon' }}
          api_location: ""
          output_location: ""
          skip_app_build: true
          production_branch: main

      - name: Report production URL
        run: echo "static_web_app_url=${STATIC_WEB_APP_URL}"
        env:
          STATIC_WEB_APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
